
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Music Genre Are You?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <h1 class="text-center mb-3">What Music Genre Are You?</h1>
        <p class="text-center">Answer these questions to find your music personality!</p>

        <div class="question-block card p-3 mb-3">
            <h5>1. What do you enjoy doing?</h5>
            <button class="btn answer-btn" data-score="1">Listening to rap</button>
            <button class="btn answer-btn" data-score="2">Relaxing with slow songs</button>
            <button class="btn answer-btn" data-score="3">Dancing</button>
            <button class="btn answer-btn" data-score="4">Discovering music</button>
        </div>

        <div class="question-block card p-3 mb-3">
            <h5>2. How would friends describe you?</h5>
            <button class="btn answer-btn" data-score="1">Confident</button>
            <button class="btn answer-btn" data-score="2">Calm</button>
            <button class="btn answer-btn" data-score="3">Outgoing</button>
            <button class="btn answer-btn" data-score="4">Creative</button>
        </div>

        <div class="question-block card p-3 mb-3">
            <h5>3. What's your ideal weekend?</h5>
            <button class="btn answer-btn" data-score="1">Going out with friends</button>
            <button class="btn answer-btn" data-score="2">Staying home</button>
            <button class="btn answer-btn" data-score="3">Going to a party</button>
            <button class="btn answer-btn" data-score="4">Finding new music</button>
        </div>

        <div class="question-block card p-3 mb-3">
            <h5>4. What matters most to you?</h5>
            <button class="btn answer-btn" data-score="1">Being yourself</button>
            <button class="btn answer-btn" data-score="2">Peace and happiness</button>
            <button class="btn answer-btn" data-score="3">Having fun</button>
            <button class="btn answer-btn" data-score="4">Expressing yourself</button>
        </div>

        <button id="show-results" class="btn btn-primary w-100 mt-3">
            Show My Results
        </button>

        <div id="result-container" class="text-center mt-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
